# Servidor de datos de OmniClin en Cloudflare (Workers + D1). Solo hace falta para instalarlo con Wrangler, desde
# esta carpeta; desde el panel de Cloudflare no se usa (README.md).
# Usa siempre «-c wrangler.toml»: sin eso, Wrangler coge el wrangler.jsonc de la carpeta de arriba (el de la app).
name = "cenit-datos"
main = "worker.js"
compatibility_date = "2026-09-01"

# La base de datos. Créala con jurisdicción de la UE (npx wrangler d1 create cenit-datos --jurisdiction eu -c wrangler.toml)
# y pega aquí el «database_id» que te da.
[[d1_databases]]
binding = "DB"
database_name = "cenit-datos"
database_id = "PEGA-AQUI-EL-ID-DE-TU-BASE"

# Opcional: el almacén de los archivos de los pacientes (R2, README.md, «Documentos»). Créalo con jurisdicción de la UE
# (npx wrangler r2 bucket create cenit-archivos --jurisdiction eu -c wrangler.toml) y quita las almohadillas.
# [[r2_buckets]]
# binding = "DOCS"
# bucket_name = "cenit-archivos"
# jurisdiction = "eu"

[vars]
# El ID de cliente de Google de la app (el mismo que «googleClientId» en public/cloud.json).
GOOGLE_CLIENT_ID = "1084216324372-0mrfdeckqcfu8p2t1tjsosdebs7g2tmb.apps.googleusercontent.com"
# Los correos de Google de los fisioterapeutas que pueden guardar copias, separados por comas.
# Vacío: no entra nadie.
ALLOWED_EMAILS = ""
# Las direcciones desde donde se abre la app, separadas por comas: la de GitHub (la clínica) y la de Cloudflare Pages
# (la app y los enlaces de los pacientes). Solo https: el servidor no admite ninguna http aquí. Al pasar a omniclin.es,
# deja solo esa dirección (https://omniclin.es).
ALLOWED_ORIGINS = "https://adrianolivascano05-maker.github.io,https://cenitfisiolab.pages.dev"

# El registro (Workers Logs): solo la línea técnica que escribe el servidor (cloudflare/src/activity.js: método, ruta
# sin datos, código y tiempo). El registro automático de cada petición queda APAGADO (invocation_logs = false): llevaría
# la dirección entera, y el id de un formulario abre el formulario. El servidor nunca escribe IPs, correos, tokens ni
# contenido.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

# Un servidor de pruebas aparte (nunca el de la clínica), para probar la app con «npm run dev»:
# npx wrangler deploy --env dev -c wrangler.toml. Lleva su propia base (crea otra con otro nombre y pega su id).
# Solo aquí vale http://localhost (DEV = "1").
[env.dev]
name = "cenit-datos-pruebas"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "cenit-datos-pruebas"
database_id = "PEGA-AQUI-EL-ID-DE-LA-BASE-DE-PRUEBAS"

[env.dev.vars]
GOOGLE_CLIENT_ID = "1084216324372-0mrfdeckqcfu8p2t1tjsosdebs7g2tmb.apps.googleusercontent.com"
ALLOWED_EMAILS = ""
ALLOWED_ORIGINS = "http://localhost:5173"
DEV = "1"
