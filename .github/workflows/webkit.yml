# Las pantallas principales en WebKit, el motor de Safari (iPhone y iPad), en un Mac de GitHub. Una vez por semana y
# cuando se pida a mano (Actions → «Safari (WebKit)» → Run workflow), no en cada push: un Mac tarda en quedar libre
# y, en un repositorio privado, cuenta muchos más minutos. Solo informa: no para ninguna publicación. En un Mac
# porque el WebKit de Linux no tiene el almacenamiento privado (OPFS) que usa la app y todo iría en memoria.
# Lo programado solo corre en la rama por defecto del repositorio.
name: Safari (WebKit)

on:
  schedule:
    - cron: "17 5 * * 1" # los lunes a las 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      # Aparte, para que si falla en el Mac se vea por qué (dentro de las pruebas no sale).
      - name: Construir la app en el Mac
        run: npm run build
      - name: Pantallas principales en WebKit (Safari)
        env:
          SIN_GOOGLE: "1"
        run: npx playwright test --browser=webkit e2e/webkit-diagnostico.spec.ts e2e/f01-patients.spec.ts e2e/f16-ficha-clinica.spec.ts e2e/agenda.spec.ts e2e/pwa.spec.ts e2e/mobile-layout.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-fallos
          path: test-results
          retention-days: 7
