# Publica la app en GitHub Pages en cada push a la rama principal del repositorio y, con las mismas pruebas pasadas,
# deja ese mismo commit en la rama «publicado-cloudflare», de la que Cloudflare Pages publica la app en la raíz
# (cenitfisiolab.pages.dev: ahí abren los pacientes sus formularios).
# Requiere una sola vez: Settings → Pages → Source: «GitHub Actions»; y en Cloudflare, el proyecto de Pages unido al
# repositorio con esa rama de producción (cloudflare/README.md, «La app en Cloudflare Pages»).
name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/replica-skill-install-zv3ker]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Corrector de código (oxlint, .oxlintrc.json): los errores paran la publicación; los avisos solo se enseñan.
      - name: Corrector de código
        run: npm run lint
      - name: Pruebas de fórmulas, base de datos y vídeo
        run: npm test
      - name: Build bajo /<repositorio>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages no tiene rutas de aplicación: las desconocidas sirven 404.html, que es la propia app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Las pruebas de pantallas (Playwright) en los dos alojamientos: en la raíz (Cloudflare) y bajo /<repositorio>/
  # (GitHub Pages). Si alguna falla, no se publica.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/${{ github.event.repository.name }}/"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pruebas de pantallas bajo ${{ matrix.base }}
        run: npx playwright test
        env:
          E2E_BASE: ${{ matrix.base }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fallos-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  # Las pantallas principales en WebKit, el motor de Safari (iPhone y iPad). De momento solo informa: no para la
  # publicación, porque no se puede probar antes en el entorno de desarrollo. Si sale en rojo, mira el detalle del
  # paso; el trabajo sale en verde igualmente. En un Mac: el WebKit de Linux no tiene el almacenamiento privado
  # (OPFS) que usa la app y todo iría en memoria (en un repositorio público, las máquinas de GitHub no se cobran).
  webkit:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Pantallas principales en WebKit (Safari)
        env:
          SIN_GOOGLE: "1"
        run: npx playwright test --browser=webkit e2e/webkit-diagnostico.spec.ts e2e/f01-patients.spec.ts e2e/f16-ficha-clinica.spec.ts e2e/agenda.spec.ts e2e/pwa.spec.ts e2e/mobile-layout.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-fallos
          path: test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Pages publica lo que llega a esta rama (solo si han pasado todas las pruebas).
  cloudflare:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: git push --force origin HEAD:refs/heads/publicado-cloudflare
