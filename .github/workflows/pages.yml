# Publica la app en GitHub Pages en cada push a la rama principal del repositorio.
# Requiere una sola vez: Settings → Pages → Source: «GitHub Actions».
name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/replica-skill-install-zv3ker]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pruebas de fórmulas, base de datos y vídeo
        run: npm test
      - name: Build bajo /<repositorio>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages no tiene rutas de aplicación: las desconocidas sirven 404.html, que es la propia app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Las pruebas de pantallas (Playwright) en los dos alojamientos: en la raíz (Cloudflare) y bajo /<repositorio>/
  # (GitHub Pages). Si alguna falla, no se publica.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/${{ github.event.repository.name }}/"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pruebas de pantallas bajo ${{ matrix.base }}
        run: npx playwright test
        env:
          E2E_BASE: ${{ matrix.base }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fallos-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
